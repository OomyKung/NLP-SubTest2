[theme]
base = "dark"
primaryColor = "#049FD9"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111A2E"
textColor = "#E6EDF7"
font = "sans serif"

[server]
headless = true
# Turn off the source-file watcher. Its module scan touches optional parts of
# `transformers` that need `torchvision` (not installed), which only fills the
# logs with a harmless ModuleNotFoundError. After pushing new code, reboot the app.
fileWatcherType = "none"

[browser]
gatherUsageStats = false
